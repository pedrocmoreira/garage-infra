apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: garage
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    processors:
      batch: {}
    exporters:
      otlp/jaeger:
        endpoint: jaeger:4317
        tls: {insecure: true}
    service:
      pipelines:
        traces: {receivers: [otlp], processors: [batch], exporters: [otlp/jaeger]}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: garage
spec:
  selector: {app: otel-collector}
  ports:
    - {name: grpc, port: 4317}
    - {name: http, port: 4318}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: garage
spec:
  replicas: 1
  selector: {matchLabels: {app: otel-collector}}
  template:
    metadata: {labels: {app: otel-collector}}
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.111.0
          args: ["--config=/etc/otel/config.yaml"]
          ports: [{containerPort: 4317}, {containerPort: 4318}]
          volumeMounts: [{name: config, mountPath: /etc/otel}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
      volumes:
        - name: config
          configMap: {name: otel-collector-config}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: garage
spec:
  selector: {app: jaeger}
  ports:
    - {name: ui, port: 16686}
    - {name: otlp-grpc, port: 4317}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: garage
spec:
  replicas: 1
  selector: {matchLabels: {app: jaeger}}
  template:
    metadata: {labels: {app: jaeger}}
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env: [{name: COLLECTOR_OTLP_ENABLED, value: "true"}]
          ports: [{containerPort: 16686}, {containerPort: 4317}]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
