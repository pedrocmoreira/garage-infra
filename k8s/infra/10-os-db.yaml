apiVersion: v1
kind: Service
metadata:
  name: os-db
  namespace: garage
spec:
  selector: {app: os-db}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: os-db
  namespace: garage
spec:
  serviceName: os-db
  replicas: 1
  selector: {matchLabels: {app: os-db}}
  template:
    metadata: {labels: {app: os-db}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{containerPort: 5432}]
          env:
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: garage-secrets, key: OS_DB_NAME}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: garage-secrets, key: OS_DB_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: garage-secrets, key: OS_DB_PASSWORD}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
