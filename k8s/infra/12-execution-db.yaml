apiVersion: v1
kind: Service
metadata:
  name: execution-db
  namespace: garage
spec:
  selector: {app: execution-db}
  ports: [{port: 27017, targetPort: 27017}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: execution-db
  namespace: garage
spec:
  serviceName: execution-db
  replicas: 1
  selector: {matchLabels: {app: execution-db}}
  template:
    metadata: {labels: {app: execution-db}}
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports: [{containerPort: 27017}]
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom: {secretKeyRef: {name: garage-secrets, key: MONGO_ROOT_USER}}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: garage-secrets, key: MONGO_ROOT_PASSWORD}}
          readinessProbe:
            exec: {command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
          volumeMounts: [{name: data, mountPath: /data/db}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
