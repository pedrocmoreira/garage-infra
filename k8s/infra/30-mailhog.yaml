apiVersion: v1
kind: Service
metadata:
  name: mailhog
  namespace: garage
spec:
  selector: {app: mailhog}
  ports:
    - {name: smtp, port: 1025, targetPort: 1025}
    - {name: web, port: 8025, targetPort: 8025}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  namespace: garage
spec:
  replicas: 1
  selector: {matchLabels: {app: mailhog}}
  template:
    metadata: {labels: {app: mailhog}}
    spec:
      containers:
        - name: mailhog
          image: mailhog/mailhog:v1.0.1
          ports: [{containerPort: 1025}, {containerPort: 8025}]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
