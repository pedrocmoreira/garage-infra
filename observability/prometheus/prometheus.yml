global:
  scrape_interval: 10s

scrape_configs:
  - job_name: os-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["os-service:8081"]}]
  - job_name: billing-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["billing-service:8082"]}]
  - job_name: execution-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["execution-service:8083"]}]
  - job_name: payment-mock-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["payment-mock-service:8084"]}]
